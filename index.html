<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест по C#</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <section class="test-card mx-auto">
      <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
        <span class="badge text-bg-primary">C#</span>
        <span id="timer" class="fw-semibold">Время: 10:00</span>
      </div>
      <h1 class="h2 mb-2">Тест по основам C#</h1>
      <p class="text-secondary mb-4">Проверь свои знания. Выбери один правильный ответ.</p>

      <div class="row g-2 mb-3">
        <div class="col-sm-6">
          <label for="topicFilter" class="form-label">Тема вопросов</label>
          <select id="topicFilter" class="form-select">
            <option value="Все темы">Все темы</option>
          </select>
        </div>
        <div class="col-sm-6 d-flex align-items-end">
          <div class="w-100">
            <div class="d-flex justify-content-between small mb-1">
              <span>Прогресс</span><span id="progressText">0 из 0</span>
            </div>
            <div class="progress" role="progressbar" aria-label="Прогресс теста">
              <div id="progressBar" class="progress-bar" style="width:0%"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="status" class="alert alert-info py-2" role="status">Загружаем вопросы...</div>
      <div id="quiz" hidden>
        <div class="small text-secondary mb-2" id="questionTopic"></div>
        <h2 class="h5 mb-3" id="questionText"></h2>
        <div id="answers" class="d-grid gap-2"></div>
        <div id="feedback" class="mt-3 fw-semibold" aria-live="polite"></div>
        <div class="d-flex justify-content-between mt-4">
          <button id="nextButton" class="btn btn-primary" disabled>Следующий вопрос</button>
          <button id="finishButton" class="btn btn-outline-secondary">Завершить</button>
        </div>
      </div>
      <div id="result" hidden></div>
      <p class="small text-secondary mt-4 mb-0">Вопросы загружаются из опубликованной Google Таблицы CSV. Если она временно недоступна, тест продолжает работать на встроенных вопросах.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
